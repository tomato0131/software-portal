{% extends "base.html" %}
{% block title %}部门管理{% endblock %}

{% block content %}
<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-title">管理后台</div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('admin_dashboard') }}" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>仪表盘</a>
            <a href="{{ url_for('admin_software') }}" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>软件管理</a>
            <a href="{{ url_for('admin_categories') }}" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>分类管理</a>
            <a href="{{ url_for('admin_users') }}" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>用户管理</a>
            <a href="{{ url_for('admin_departments') }}" class="sidebar-link active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>部门管理</a>
            <a href="{{ url_for('admin_permissions') }}" class="sidebar-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>权限管理</a>
        </nav>
    </aside>

    <div class="admin-content fade-in-up">
        <h2>部门管理</h2>
        <p class="subtitle">管理公司部门信息</p>

        <div class="admin-form">
            <h3>添加部门</h3>
            <form method="POST">
                <div class="form-row">
                    <div class="form-group" style="max-width:360px;">
                        <label>部门名称</label>
                        <input type="text" name="name" required placeholder="如：信息技术部">
                    </div>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-accent">添加部门</button>
                </div>
            </form>
        </div>

        <div class="data-table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>部门名称</th>
                        <th>用户数</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for dept in departments %}
                    <tr>
                        <td style="font-weight:500;">{{ dept.name }}</td>
                        <td>{{ dept.users.count() }}</td>
                        <td>
                            <div style="display:flex;gap:6px;">
                                <button class="btn btn-sm btn-ghost" onclick="showEditDeptModal({{ dept.id }}, '{{ dept.name }}')">编辑</button>
                                <form method="POST" action="{{ url_for('admin_departments_delete', id=dept.id) }}" style="display:inline;" onsubmit="return confirm('确定删除此部门？')">
                                    <button type="submit" class="btn btn-sm btn-danger">删除</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="editDeptModal" style="display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);align-items:center;justify-content:center;">
    <div style="background:white;border-radius:18px;padding:32px;width:90%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
        <h3 style="margin-bottom:20px;font-size:17px;">编辑部门</h3>
        <form id="editDeptForm" method="POST">
            <div class="form-group">
                <label>部门名称</label>
                <input type="text" id="editDeptName" name="name" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-accent">保存</button>
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('editDeptModal').style.display='none'">取消</button>
            </div>
        </form>
    </div>
</div>

<script>
function showEditDeptModal(id, name) {
    document.getElementById('editDeptForm').action = '{{ url_for("admin_departments_edit", id=0) }}'.replace('/0', '/' + id);
    document.getElementById('editDeptName').value = name;
    document.getElementById('editDeptModal').style.display = 'flex';
}
document.getElementById('editDeptModal').addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
});
</script>
{% endblock %}
